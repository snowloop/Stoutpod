name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sequential on purpose: both runs attach assets to the same draft release.
      - name: Publish arm64
        run: pnpm run publish:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # install.sh reads /releases/latest, which ignores drafts.
      - name: Publish the draft release
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
